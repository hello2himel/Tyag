name: CI

# Quality gates for the local-first deUrge app:
#   - typecheck all workspaces
#   - unit tests (packages/core)
#   - production web build
#   - privacy audit (bundle must be fully offline)
#   - Tauri desktop packaging validation (release binary + WebKitGTK linkage,
#     Rust unit tests for the persistence commands)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.design/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'

jobs:
  quality:
    name: Typecheck · Test · Build · Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @deurge/web build

      - name: Privacy audit (offline-only bundle)
        run: pnpm audit:privacy

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  tauri-package:
    name: Tauri packaging (linux binary)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Tauri build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ci-tauri-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @deurge/web build

      - name: Rust tests (persistence commands + navigation guard)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Check desktop version consistency
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          test "$TAURI_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"

      - name: Build Tauri release binary (no bundle)
        run: pnpm --filter @deurge/desktop build

      - name: Verify packaged binary
        # A full headless WebKitGTK boot is display-dependent and flaky on CI
        # runners, so CI asserts the release binary exists, links the system
        # WebKitGTK 4.1, and embeds the strict CSP + assets at compile time.
        # Real launch/persistence validation is documented in docs/BUILDING.md.
        run: |
          set -euo pipefail
          binary=apps/desktop/src-tauri/target/release/deurge
          test -x "$binary"
          ldd "$binary" | tee /tmp/ldd.txt
          grep -E 'webkit2gtk-4\.1' /tmp/ldd.txt
          grep -E 'javascriptcoregtk-4\.1' /tmp/ldd.txt
          ! ldd "$binary" | grep -qiE 'libQt|libnode|libelectron'
          grep -q "wasm-unsafe-eval" "$binary"
          echo "Tauri binary OK: $(du -h "$binary" | cut -f1)"

      - name: Upload tauri binary
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-binary
          path: apps/desktop/src-tauri/target/release/deurge
          retention-days: 7

# Web deployment notes:
#   * Production web hosting is Netlify via netlify.toml (publish apps/web/dist).
#   * GitHub Pages is optional; if you enable it, add a deploy job using
#     actions/configure-pages + actions/upload-pages-artifact + actions/deploy-pages
#     with `permissions: pages: write, id-token: write` and publish apps/web/dist.
#   * Netlify's build command is `pnpm --filter @deurge/web build`; no environment
#     variables or secrets are required (the app is static and local-only).
