name: Release

# Tag-driven release: builds every distributable platform artifact, writes
# SHA256SUMS.txt for all of them and creates a DRAFT GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match the version in the root package.json (vX.Y.Z). Review the
# draft, then publish it. See docs/RELEASING.md.
#
# Platform workflows (ci.yml, android.yml, flatpak.yml, desktop-*.yml, ios.yml)
# remain the per-PR/per-push CI; this workflow is the single release entrypoint.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches package.json
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$VERSION" = "${GITHUB_REF_NAME}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION" >&2
              exit 1
            }
          fi
          TAURI_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          test "$TAURI_VERSION" = "$VERSION" || {
            echo "tauri.conf.json version $TAURI_VERSION does not match package.json $VERSION" >&2
            exit 1
          }
          test "$CARGO_VERSION" = "$VERSION" || {
            echo "src-tauri/Cargo.toml version $CARGO_VERSION does not match package.json $VERSION" >&2
            exit 1
          }
          echo "Releasing deUrge $VERSION"

  web:
    name: Web PWA
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deurge/web build
      - run: pnpm audit:privacy
      - name: Zip web build
        run: |
          set -euo pipefail
          cd apps/web/dist
          zip -qr "$RUNNER_TEMP/deUrge-${{ needs.version.outputs.version }}-web.zip" .
          cp "$RUNNER_TEMP/deUrge-${{ needs.version.outputs.version }}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist/deUrge-*-web.zip
          retention-days: 7

  android:
    name: Android APK/AAB
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          # The `tools` package was removed from the modern SDK; install only
          # what the build needs (the action also accepts the SDK licenses).
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Resolve signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deurge-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured — release build will be debug-signed."
          fi
      - name: Build signed release
        if: steps.signing.outputs.available == 'true'
        env:
          DEURGE_KEYSTORE: ${{ runner.temp }}/deurge-release.jks
          DEURGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DEURGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEURGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm --filter @deurge/mobile build:android:release
      - name: Build debug APK (fallback)
        if: steps.signing.outputs.available != 'true'
        run: pnpm --filter @deurge/mobile build:android:debug
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/deurge-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/dist
          retention-days: 7

  linux:
    name: Linux AppImage / deb / rpm
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-linux-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential pkg-config \
            curl wget file patchelf rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deurge/desktop dist:linux
      - name: Checksums
        run: |
          set -euo pipefail
          cd apps/desktop/release
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 7

  flatpak:
    name: Linux Flatpak
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-flatpak-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Install native build + flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential pkg-config \
            flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: pnpm install --frozen-lockfile
      - run: BUILD=direct bash flatpak/build.sh
      - name: Verify bundle
        run: |
          set -euo pipefail
          ls -lh flatpak/dist
          (cd flatpak/dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            flatpak/dist/*.flatpak
            flatpak/dist/SHA256SUMS.txt
          retention-days: 7

  windows:
    name: Windows installers
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-windows-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deurge/desktop dist:win
      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/desktop/release
          $sums = Get-Content SHA256SUMS.txt
          foreach ($line in $sums) {
            $hash, $file = $line -split '\s+', 2
            $actual = (Get-FileHash (Join-Path $PWD $file) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "Checksum mismatch for $file" }
          }
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 7

  macos:
    name: macOS DMG
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-macos-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deurge/desktop dist:mac
      - name: Checksums
        run: |
          set -euo pipefail
          cd apps/desktop/release
          cat SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 7

  ios:
    name: iOS unsigned build
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.15.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash apps/mobile/scripts/build-ios.sh archive
      - name: Package unsigned archive
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            apps/mobile/dist/ios/deUrge.xcarchive \
            "apps/mobile/dist/ios/deUrge-${{ needs.version.outputs.version }}-unsigned.xcarchive.zip"
          cd apps/mobile/dist/ios
          shasum -a 256 *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            apps/mobile/dist/ios/*.zip
            apps/mobile/dist/ios/SHA256SUMS.txt
          retention-days: 7

  publish:
    name: Publish draft GitHub release
    needs: [version, web, android, linux, flatpak, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ needs.version.outputs.version }}"
          find artifacts -type f ! -name 'SHA256SUMS.txt' -print0 \
            | while IFS= read -r -d '' f; do cp -n "$f" dist/; done
          cd dist
          shasum -a 256 * > SHA256SUMS.txt
          echo "Release files:"
          ls -lh

      - name: Create or update draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tag can be re-pushed or a release may already be published (for
          # example, a locally built release uploaded by a maintainer). Never
          # fail the workflow and never overwrite a published release with
          # CI-built, unsigned variants.
          if gh release view "$TAG" --json isDraft --jq '.isDraft' >/tmp/release-state 2>/dev/null; then
            if [ "$(cat /tmp/release-state)" = "true" ]; then
              echo "Draft release $TAG exists — uploading rebuilt artifacts."
              gh release upload "$TAG" dist/* --clobber
            else
              echo "Published release $TAG already exists — leaving its assets untouched."
              echo "The rebuilt artifacts are available as this workflow's artifacts."
            fi
          else
            gh release create "$TAG" \
              --draft \
              --title "deUrge $VERSION" \
              --generate-notes \
              --notes "Local-first, offline deUrge $VERSION. All artifacts are built from this tag; see SHA256SUMS.txt for checksums and docs/RELEASING.md for verification steps." \
              dist/*
          fi

      - name: Summary
        run: |
          {
            echo "## deUrge ${{ needs.version.outputs.version }} draft release"
            echo
            echo "Artifacts uploaded to release \`v${{ needs.version.outputs.version }}\`:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
