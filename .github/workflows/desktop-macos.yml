name: Desktop macOS (DMG)

# electron-builder macOS disk image (unsigned unless a Developer ID certificate
# is provided via CI secrets — see docs/RELEASING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  macos:
    name: DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @deurge/web build

      - name: Package DMG
        run: pnpm --filter @deurge/desktop dist:mac

      - name: Verify + checksums
        run: |
          set -euo pipefail
          ls -lh apps/desktop/release
          cd apps/desktop/release
          shopt -s nullglob
          dmgs=(*.dmg)
          test ${#dmgs[@]} -gt 0
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
