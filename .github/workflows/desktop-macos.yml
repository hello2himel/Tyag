name: Desktop macOS (Tauri)

# Tauri 2 macOS disk image, rendered by the system WKWebView. Unsigned by
# design: `bundle.macOS.signingIdentity` is null in tauri.conf.json and no
# signing secrets are referenced, so CI needs no certificates. A maintainer can
# sign/notarize a locally built DMG later (see docs/RELEASING.md).
#
# Output (normalised by scripts/collect-tauri-artifacts.mjs):
#   apps/desktop/release/Tyag-<version>-<arch>.dmg   (x64 | arm64)
#   apps/desktop/release/SHA256SUMS.txt

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/collect-tauri-artifacts.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'scripts/collect-tauri-artifacts.mjs'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'

jobs:
  macos:
    name: DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Tauri build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-macos-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        run: pnpm --filter @tyag/desktop dist:mac

      - name: Verify DMG + checksums
        run: |
          set -euo pipefail
          ls -lh apps/desktop/release
          shopt -s nullglob
          dmgs=(apps/desktop/release/*.dmg)
          test ${#dmgs[@]} -eq 1
          (cd apps/desktop/release && shasum -a 256 -c SHA256SUMS.txt)
          file apps/desktop/src-tauri/target/release/tyag
          hdiutil verify apps/desktop/release/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
