name: Desktop Windows (Tauri)

# Tauri 2 Windows installers: NSIS (.exe) + MSI, using the system WebView2
# runtime. Builds are unsigned: no code-signing secrets are required. To sign a
# real release, provide the standard Tauri variables in CI (see
# docs/RELEASING.md): they are never committed.
#
# Output (normalised by scripts/collect-tauri-artifacts.mjs):
#   apps/desktop/release/Tyag-Setup-<version>-x64.exe
#   apps/desktop/release/Tyag-<version>-x64.msi
#   apps/desktop/release/SHA256SUMS.txt

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'scripts/collect-tauri-artifacts.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'scripts/collect-tauri-artifacts.mjs'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'

jobs:
  windows:
    name: NSIS / MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Tauri build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-windows-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Cache Tauri bundler tools (NSIS, WiX)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: tauri-bundler-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        run: pnpm --filter @tyag/desktop dist:win

      - name: Verify installers + checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem apps/desktop/release | Format-Table Name, Length
          $exe = Get-ChildItem apps/desktop/release/*.exe
          $msi = Get-ChildItem apps/desktop/release/*.msi
          if ($exe.Count -ne 1) { throw "Expected one NSIS installer, got $($exe.Count)" }
          if ($msi.Count -ne 1) { throw "Expected one MSI, got $($msi.Count)" }
          Push-Location apps/desktop/release
          $sums = Get-Content SHA256SUMS.txt
          foreach ($line in $sums) {
            $hash, $file = $line -split '\s+', 2
            $actual = (Get-FileHash (Join-Path $PWD $file) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "Checksum mismatch for $file" }
          }
          Pop-Location

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
