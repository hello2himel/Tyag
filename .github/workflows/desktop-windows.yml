name: Desktop Windows (NSIS)

# electron-builder Windows installer (unsigned; signing is configured in CI
# secrets for real releases — see docs/RELEASING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'
  # No code-signing certificate is committed: build unsigned unless CI secrets
  # provide CSC_LINK/CSC_KEY_PASSWORD (electron-builder picks them up).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @deurge/web build

      - name: Package NSIS installer
        run: pnpm --filter @deurge/desktop dist:win

      - name: Verify + checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = Get-ChildItem apps/desktop/release/*.exe
          if ($installers.Count -eq 0) { throw 'No NSIS installer produced' }
          $installers | ForEach-Object { Write-Host $_.FullName, $_.Length }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          Set-Content -Path apps/desktop/release/SHA256SUMS.txt -Value $lines
          Get-Content apps/desktop/release/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
