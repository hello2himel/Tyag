# Tyag — Flatpak manifest (Tauri 2 + WebKitGTK).
#
# This packages the *prebuilt* Tauri binary (built outside the sandbox by
# flatpak/build.sh, because the web + Rust toolchain is not available inside
# the Flatpak build sandbox) with a `simple` module. The GNOME runtime ships
# GTK 3 and WebKitGTK 4.1, which is what Tauri links against on Linux.
#
#   runtime : org.gnome.Platform //48   (WebKitGTK 4.1 + GTK 3)
#   sdk     : org.gnome.Sdk      //48   (build sandbox only; never shipped)
#   command : tyag-wrapper -> /app/bin/tyag (the Tauri binary)
#
# Sandbox policy (deliberately minimal — Tyag is fully offline):
#   * no --share=network: the app can never reach the network
#   * no --filesystem=home: the database stays inside the app sandbox
#   * xdg-download is the only filesystem grant, so user-initiated JSON/CSV
#     exports and backups can reach the real Downloads folder
#   * notifications via the session bus notification service
#
# Build: `bash flatpak/build.sh`   Bundle: flatpak/dist/Tyag-<version>-<arch>.flatpak
app-id: org.tyag.Tyag
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: tyag-wrapper
separate-locales: false

finish-args:
  # WebKitGTK needs shared memory (GTK) and hardware rendering for the WebView.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Only for user-initiated JSON/CSV exports and database backups; nothing else
  # on the host is visible.
  - --filesystem=xdg-download:rw
  # Local reminders need the desktop notification service.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: tyag
    buildsystem: simple
    # The Tauri binary is built and tested on the host; do not strip it here.
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - install -Dm755 tyag /app/bin/tyag
      - install -Dm755 tyag-wrapper.sh /app/bin/tyag-wrapper
      - install -Dm644 org.tyag.Tyag.desktop /app/share/applications/org.tyag.Tyag.desktop
      - install -Dm644 org.tyag.Tyag.metainfo.xml /app/share/metainfo/org.tyag.Tyag.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/org.tyag.Tyag.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/org.tyag.Tyag.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/org.tyag.Tyag.png
    sources:
      - type: dir
        path: build/stage
